apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: student-platform
    spec:
      containers:
        - name: student-platform
          image: student-platform:v1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
